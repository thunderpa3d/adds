<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نظام إدارة جهات الاتصال العسكرية - إصدار 1.0">
    <meta name="theme-color" content="#0a2e0a">
    <title>نظام الاتصالات العسكرية | القيادة العامة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0a2e0a;
            --secondary: #1e3c1e;
            --accent: #c9b458;
            --accent-dark: #a89648;
            --danger: #a52a2a;
            --success: #2e7d32;
            --info: #1e5a8c;
            --light: #e8f5e9;
            --dark: #051e05;
            --text-primary: #f0f0f0;
            --text-secondary: #c8c8c8;
            --bg-gradient: linear-gradient(135deg, #0a2e0a 0%, #1e3c1e 100%);
            --card-bg: rgba(15, 40, 15, 0.85);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
            --shadow-hover: 0 6px 12px rgba(0, 0, 0, 0.3);
            --camo-pattern: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230a2e0a"/><path d="M0,0 L30,0 L20,30 L0,30 Z" fill="%231e3c1e"/><path d="M70,0 L100,0 L100,30 L80,30 Z" fill="%231e3c1e"/><path d="M0,70 L20,70 L0,100 Z" fill="%231e3c1e"/><path d="M80,70 L100,70 L100,100 L70,100 Z" fill="%231e3c1e"/></svg>');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            font-size: 13px;
        }

        body {
            background: var(--bg-gradient) fixed, var(--camo-pattern);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* طبقة التحميل */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(201, 180, 88, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: var(--accent);
            margin-top: 15px;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        /* الهيكل العام */
        .app-container {
            display: grid;
            grid-template-areas:
                "header"
                "main"
                "footer";
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
        }

        /* الشريط العلوي */
        .header {
            grid-area: header;
            background-color: var(--primary);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1rem;
            font-weight: bold;
        }

        .logo i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .nav-btn:hover {
            background-color: rgba(201, 180, 88, 0.1);
            color: var(--accent);
        }

        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background: var(--primary);
            transition: right 0.4s ease;
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.2);
            border-left: 1px solid var(--accent);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 0.8rem;
        }

        .sidebar-title {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 0.4rem;
        }

        .sidebar-menu a {
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.8rem;
            border-radius: 4px;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .sidebar-menu a:hover {
            background-color: rgba(201, 180, 88, 0.1);
            color: var(--accent);
        }

        .sidebar-menu a i {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: 1.5rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        /* المحتوى الرئيسي */
        .main-content {
            grid-area: main;
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* بطاقة المحتوى */
        .content-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(201, 180, 88, 0.3);
            backdrop-filter: blur(4px);
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(201, 180, 88, 0.3);
            gap: 0.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* شريط الحالة */
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 0.6rem 0.8rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--accent);
            font-size: 0.85rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 4px var(--success);
        }

        /* نموذج الإضافة */
        .contact-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 0.8rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.3rem;
            color: var(--accent);
            font-weight: bold;
            font-size: 0.85rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(201, 180, 88, 0.3);
            border-radius: 4px;
            color: var(--text-primary);
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(201, 180, 88, 0.2);
        }

        .btn {
            padding: 0.7rem 1.2rem;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--dark);
        }

        .btn-primary:hover {
            background-color: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        /* شريط البحث */
        .search-box {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(201, 180, 88, 0.3);
            border-radius: 4px;
            color: var(--text-primary);
            margin-bottom: 1.2rem;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(201, 180, 88, 0.2);
        }

        /* قائمة الاتصالات */
        .contacts-list {
            list-style: none;
        }

        .contact-item {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 0.9rem;
            margin-bottom: 0.8rem;
            transition: var(--transition);
            border-left: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .contact-item:hover {
            background-color: rgba(0, 0, 0, 0.3);
            border-left-color: var(--accent);
            transform: translateX(3px);
        }

        .contact-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            gap: 0.5rem;
        }

        .contact-name {
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .contact-number {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 0.7rem 0.9rem;
            border-radius: 4px;
            border: 1px solid rgba(201, 180, 88, 0.3);
            width: 100%;
            margin-bottom: 0.8rem;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .contact-number:focus {
            outline: none;
            border-color: var(--accent);
        }

        .contact-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .detail-label {
            color: var(--accent);
            font-weight: bold;
            min-width: 70px;
            font-size: 0.85rem;
        }

        .detail-value {
            flex: 1;
            word-break: break-word;
        }

        .contact-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.8rem;
        }

        .btn-sm {
            padding: 0.5rem 0.8rem;
            font-size: 0.85rem;
            flex: 1;
            min-width: 100px;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #8b0000;
            transform: translateY(-2px);
        }

        .btn-info {
            background-color: var(--info);
            color: white;
        }

        .btn-info:hover {
            background-color: #1565c0;
            transform: translateY(-2px);
        }

        /* الرتب العسكرية */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: rgba(201, 180, 88, 0.2);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: bold;
            border: 1px solid var(--accent);
        }

        /* وسائل التواصل */
        .social-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.7rem;
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: var(--transition);
        }

        .whatsapp-link {
            background-color: rgba(46, 125, 50, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .whatsapp-link:hover {
            background-color: rgba(46, 125, 50, 0.2);
        }

        .telegram-link {
            background-color: rgba(30, 90, 140, 0.1);
            border: 1px solid var(--info);
            color: var(--info);
        }

        .telegram-link:hover {
            background-color: rgba(30, 90, 140, 0.2);
        }

        /* رسالة عدم وجود نتائج */
        .no-results {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            background-color: rgba(165, 42, 42, 0.1);
            border-radius: 4px;
            border: 1px dashed rgba(165, 42, 42, 0.3);
            font-size: 0.9rem;
        }

        /* التذييل */
        .footer {
            grid-area: footer;
            background-color: var(--primary);
            padding: 0.8rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid rgba(201, 180, 88, 0.2);
        }

        /* تأثيرات الحركة */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.9); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(165, 42, 42, 0.3); }
            70% { box-shadow: 0 0 0 8px rgba(165, 42, 42, 0); }
            100% { box-shadow: 0 0 0 0 rgba(165, 42, 42, 0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
        }

        /* حالة الطوارئ */
        .emergency {
            animation: pulse 1.5s infinite;
            border-left-color: var(--danger) !important;
        }

        /* التجاوب مع الشاشات الصغيرة */
        @media (max-width: 768px) {
            * {
                font-size: 12px;
            }
            
            .main-content {
                padding: 0.8rem;
            }
            
            .content-card {
                padding: 0.8rem;
            }
            
            .contact-details {
                grid-template-columns: 1fr;
                font-size: 0.8rem;
            }
            
            .contact-actions .btn-sm {
                min-width: auto;
                flex: 1 1 45%;
            }
            
            .sidebar {
                width: 250px;
            }
            
            .status-bar {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .contact-form {
                grid-template-columns: 1fr;
            }
            
            .contact-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .contact-actions .btn-sm {
                flex: 1 1 100%;
            }
            
            .social-links {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- طبقة التحميل -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">جاري تحميل النظام العسكري...</div>
    </div>

    <div class="app-container">
        <!-- الشريط العلوي -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-radio"></i>
                <span>نظام الاتصالات العسكرية</span>
            </div>
            <button class="nav-btn" id="menuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </header>

        <!-- القائمة الجانبية -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 class="sidebar-title">القائمة الرئيسية</h3>
                <button class="nav-btn" id="closeSidebar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <ul class="sidebar-menu">
                <li><a href="#"><i class="fas fa-home"></i>الرئيسية</a></li>
                <li><a href="#"><i class="fas fa-users"></i>جهات الاتصال</a></li>
                <li><a href="#"><i class="fas fa-file-contract"></i>التقارير</a></li>
                <li><a href="#"><i class="fas fa-cog"></i>الإعدادات</a></li>
                <li><a href="#"><i class="fas fa-database"></i>النسخ الاحتياطي</a></li>
            </ul>
            
            <div class="sidebar-footer">
                <p>تطوير أبو رعد الحموي</p>
                <p>الإصدار 1.0.0</p>
            </div>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <div class="content-card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-address-book"></i>
                        سجل جهات الاتصال
                    </h2>
                    <div class="status-bar">
                        <div class="status-item">
                            <span class="status-icon"></span>
                            <span>حالة النظام: نشط</span>
                        </div>
                        <div class="status-item">
                            <span>عدد الجهات: </span>
                            <span id="contactsCount">2</span>
                        </div>
                        <div class="status-item">
                            <span>آخر تحديث: </span>
                            <span id="currentTime"></span>
                        </div>
                    </div>
                </div>

                <!-- نموذج إضافة جهة اتصال -->
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" class="form-control" id="contactName" placeholder="اسم الجندي الكامل" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">رقم الاتصال</label>
                        <input type="tel" class="form-control" id="contactNumber" placeholder="رقم الهاتف الأساسي" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">الرتبة</label>
                        <select class="form-control" id="contactRank" required>
                            <option value="">اختر الرتبة</option>
                            <option value="soldier">جندي</option>
                            <option value="corporal">مسؤل جماعة</option>
                            <option value="sergeant">نائب مسؤل سرية</option>
                            <option value="lieutenant">مسؤل سرية</option>
                            <option value="captain">ميداني</option>
                            <option value="major">مسؤل عمليات</option>
                            <option value="colonel">ادارة عسكرية</option>
                             <option value="colonel"> قائد أركان</option>
                            <option value="general"> قائد كتيبة</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">السوية</label>
                        <input type="text" class="form-control" id="contactUnit" placeholder="اسم الوحدة أو الكتيبة">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">واتساب</label>
                        <input type="tel" class="form-control" id="contactWhatsapp" placeholder="966501234567">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">تيليجرام</label>
                        <input type="text" class="form-control" id="contactTelegram" placeholder="اسم المستخدم">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">ملاحظات</label>
                        <textarea class="form-control" id="contactNotes" rows="2" placeholder="أي ملاحظات إضافية"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-user-plus"></i>
                            إضافة جهة اتصال
                        </button>
                    </div>
                </form>

                <!-- شريط البحث -->
                <input type="search" class="search-box" id="searchInput" placeholder="ابحث عن جهة اتصال...">

                <!-- قائمة جهات الاتصال -->
                <ul class="contacts-list" id="contactsList">
                  
                    
                </ul>
            </div>
        </main>

        <!-- التذييل -->
        <footer class="footer">
            <p>نظام الاتصالات العسكرية © تطوير TF3RAAD@</p>
        </footer>
    </div>

    <script>
        // تهيئة النظام عند التحميل
        document.addEventListener('DOMContentLoaded', function() {
            // إخفاء شاشة التحميل بعد 2 ثانية
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                }, 500);
            }, 2000);
            
            // تحديث الوقت الحالي
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            
            // تحديث عدد جهات الاتصال
            updateContactsCount();
            
            // تهيئة القائمة الجانبية
            setupSidebar();
            
            // تهيئة نموذج الإضافة
            setupContactForm();
            
            // تهيئة وظيفة البحث
            setupSearch();
        });
        
        // تحديث الوقت الحالي
        function updateCurrentTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const dateString = now.toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('currentTime').textContent = `${dateString} - ${timeString}`;
        }
        
        // تحديث عدد جهات الاتصال
        function updateContactsCount() {
            const contacts = document.querySelectorAll('#contactsList .contact-item').length;
            document.getElementById('contactsCount').textContent = contacts;
        }
        
        // تهيئة القائمة الجانبية
        function setupSidebar() {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeSidebar');
            const sidebar = document.getElementById('sidebar');
            
            menuBtn.addEventListener('click', () => {
                sidebar.classList.add('active');
            });
            
            closeBtn.addEventListener('click', () => {
                sidebar.classList.remove('active');
            });
            
            // إغلاق القائمة عند النقر خارجها
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && e.target !== menuBtn) {
                    sidebar.classList.remove('active');
                }
            });
        }
        
        // تهيئة نموذج إضافة جهة اتصال
        function setupContactForm() {
            const form = document.getElementById('contactForm');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('contactName').value.trim();
                const number = document.getElementById('contactNumber').value.trim();
                const rank = document.getElementById('contactRank').value;
                const unit = document.getElementById('contactUnit').value.trim();
                const whatsapp = document.getElementById('contactWhatsapp').value.trim();
                const telegram = document.getElementById('contactTelegram').value.trim();
                const notes = document.getElementById('contactNotes').value.trim();
                
                if (name && number && rank) {
                    addNewContact({
                        name,
                        number,
                        rank,
                        unit,
                        whatsapp,
                        telegram,
                        notes
                    });
                    
                    form.reset();
                } else {
                    alert('الرجاء إدخال البيانات الأساسية (الاسم، الرقم، الرتبة)');
                }
            });
        }
        
        // إضافة جهة اتصال جديدة
        function addNewContact(contact) {
            const contactsList = document.getElementById('contactsList');
            
            // إنشاء عنصر HTML لجهة الاتصال الجديدة
            const contactItem = document.createElement('li');
            contactItem.className = 'contact-item';
            contactItem.innerHTML = `
                <div class="contact-header">
                    <h3 class="contact-name">
                        <span class="rank-badge">${getRankBadge(contact.rank)}</span>
                        ${contact.name}
                    </h3>
                    <div class="contact-number">${formatPhoneNumber(contact.number)}</div>
                </div>
                
                <div class="contact-details">
                    <div class="detail-row">
                        <span class="detail-label">الرتبة:</span>
                        <span class="detail-value">${getRankName(contact.rank)}</span>
                    </div>
                    
                    ${contact.unit ? `
                    <div class="detail-row">
                        <span class="detail-label">السوية:</span>
                        <span class="detail-value">${contact.unit}</span>
                    </div>
                    ` : ''}
                    
                    ${contact.notes ? `
                    <div class="detail-row">
                        <span class="detail-label">ملاحظات:</span>
                        <span class="detail-value">${contact.notes}</span>
                    </div>
                    ` : ''}
                </div>
                
                <div class="social-links">
                    ${contact.whatsapp ? `
                    <a href="https://wa.me/${contact.whatsapp}" class="social-link whatsapp-link" target="_blank">
                        <i class="fab fa-whatsapp"></i>
                        واتساب
                    </a>
                    ` : ''}
                    
                    ${contact.telegram ? `
                    <a href="https://t.me/${contact.telegram}" class="social-link telegram-link" target="_blank">
                        <i class="fab fa-telegram"></i>
                        تيليجرام
                    </a>
                    ` : ''}
                </div>
                
                <div class="contact-actions">
                    <button class="btn btn-info btn-sm" onclick="editContact(this)">
                        <i class="fas fa-edit"></i>
                        تعديل
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteContact(this)">
                        <i class="fas fa-trash"></i>
                        حذف
                    </button>
                    <button class="btn btn-success btn-sm" onclick="callContact(this)">
                        <i class="fas fa-phone"></i>
                        اتصال
                    </button>
                </div>
            `;
            
            // إضافة تأثير ظهور
            contactItem.style.opacity = '0';
            contactItem.style.transform = 'translateY(15px)';
            contactItem.style.animation = 'fadeIn 0.4s forwards';
            
            // إضافة جهة الاتصال إلى القائمة
            contactsList.prepend(contactItem);
            
            // تحديث عدد جهات الاتصال
            updateContactsCount();
            
            // إخفاء رسالة عدم وجود نتائج إذا كانت موجودة
            const noResults = document.querySelector('.no-results');
            if (noResults) {
                noResults.remove();
            }
            
            // عرض رسالة نجاح
            alert(`تم إضافة ${contact.name} إلى سجل الاتصالات بنجاح`);
        }
        
        // تهيئة وظيفة البحث
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                const contacts = document.querySelectorAll('#contactsList .contact-item');
                let hasResults = false;
                
                contacts.forEach(contact => {
                    const name = contact.querySelector('.contact-name').textContent.toLowerCase();
                    const number = contact.querySelector('.contact-number').textContent.toLowerCase();
                    const rank = contact.querySelector('.detail-value').textContent.toLowerCase();
                    
                    if (name.includes(searchTerm) || number.includes(searchTerm) || rank.includes(searchTerm)) {
                        contact.style.display = 'flex';
                        hasResults = true;
                    } else {
                        contact.style.display = 'none';
                    }
                });
                
                // عرض رسالة عدم وجود نتائج إذا لزم الأمر
                const noResults = document.querySelector('.no-results');
                if (!hasResults && contacts.length > 0) {
                    if (!noResults) {
                        const noResultsElement = document.createElement('li');
                        noResultsElement.className = 'no-results';
                        noResultsElement.textContent = 'لا توجد نتائج مطابقة للبحث';
                        document.getElementById('contactsList').appendChild(noResultsElement);
                    }
                } else if (noResults) {
                    noResults.remove();
                }
                
                // تحديث عدد جهات الاتصال الظاهرة
                updateContactsCount();
            });
        }
        
        // تعديل جهة اتصال
        function editContact(button) {
            const contactItem = button.closest('.contact-item');
            const name = contactItem.querySelector('.contact-name').textContent.trim();
            const number = contactItem.querySelector('.contact-number').textContent.trim();
            
            const newName = prompt('عدل اسم الجندي:', name);
            if (newName !== null) {
                contactItem.querySelector('.contact-name').textContent = newName;
                
                const newNumber = prompt('عدل رقم الاتصال:', number);
                if (newNumber !== null) {
                    contactItem.querySelector('.contact-number').textContent = newNumber;
                    alert('تم تحديث بيانات الجندي بنجاح');
                }
            }
        }
        
        // حذف جهة اتصال
        function deleteContact(button) {
            if (confirm('هل أنت متأكد من حذف هذه الجهة من النظام؟')) {
                const contactItem = button.closest('.contact-item');
                contactItem.style.animation = 'fadeOut 0.3s forwards';
                
                setTimeout(() => {
                    contactItem.remove();
                    updateContactsCount();
                    
                    // عرض رسالة عدم وجود نتائج إذا لم يتبقى أي جهات
                    const contacts = document.querySelectorAll('#contactsList .contact-item');
                    if (contacts.length === 0) {
                        const noResultsElement = document.createElement('li');
                        noResultsElement.className = 'no-results';
                        noResultsElement.textContent = 'لا توجد جهات اتصال مسجلة';
                        document.getElementById('contactsList').appendChild(noResultsElement);
                    }
                }, 300);
            }
        }
        
        // الاتصال بجهة اتصال
        function callContact(button) {
            const contactItem = button.closest('.contact-item');
            const number = contactItem.querySelector('.contact-number').textContent.trim();
            
            if (number) {
                // تأثير الاهتزاز عند الاتصال
                contactItem.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    contactItem.style.animation = '';
                }, 500);
                
                // تسجيل وقت الاتصال
                const now = new Date();
                const callTime = now.toLocaleTimeString('ar-EG');
                
                // في التطبيق الفعلي، هذا سيفتح تطبيق الهاتف
                console.log(`الاتصال بالرقم: ${number}`);
                
                // إشعار بنجاح الاتصال
                alert(`تم بدء الاتصال بالرقم: ${number}\nالوقت: ${callTime}`);
            } else {
                alert('الرجاء إدخال رقم اتصال صحيح');
            }
        }
        
        // وظائف مساعدة
        function getRankBadge(rank) {
            const badges = {
                'soldier': 'ج',
                'corporal': 'ع',
                'sergeant': 'ر',
                'lieutenant': 'م',
                'captain': 'ن',
                'major': 'ر',
                'colonel': 'ع',
                'general': 'ل'
            };
            return badges[rank] || 'ج';
        }
        
        function getRankName(rank) {
            const names = {
                'soldier': 'جندي',
                'corporal': 'مسؤل جماعة',
                'sergeant': 'نائب سرية',
                'lieutenant': 'مسؤل سرية',
                'captain': 'ميداني',
                'major': 'مسؤل عمليات',
                'colonel': 'أدارة عسكرية',
                'colonel': 'قائد أركان',
                'general': 'قائد كتيبة'
            };
            return names[rank] || 'غير محدد';
        }
        
        function formatPhoneNumber(phone) {
            // إزالة أي أحرف غير رقمية
            const cleaned = ('' + phone).replace(/\D/g, '');
            
            // تنسيق الرقم حسب الطول
            const match = cleaned.match(/^(\d{3})(\d{3})(\d{4})$/);
            if (match) {
                return '+' + match[1] + ' ' + match[2] + ' ' + match[3];
            }
            
            return phone;
        }
    </script>
</body>
</html>
